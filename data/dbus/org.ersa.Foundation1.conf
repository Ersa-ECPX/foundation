<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Only root may own the name. Anyone may call it: every state-changing method is authorized with
  polkit inside the daemon, and the read-only methods are public by design.
-->
<busconfig>
  <policy user="root">
    <allow own="org.ersa.Foundation1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ersa.Foundation1"/>
    <allow receive_sender="org.ersa.Foundation1"/>
  </policy>
</busconfig>
